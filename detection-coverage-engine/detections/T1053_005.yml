title: Scheduled Task Creation via schtasks.exe
id: 5a2c4e1b-6d3f-4a2c-9e1b-4c5d6e1a2b3c
status: experimental
description: Detects creation of a scheduled task via schtasks.exe, a common persistence mechanism.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: detection-coverage-engine
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection
falsepositives:
  - Legitimate scheduled task creation by IT/software installers
level: medium
