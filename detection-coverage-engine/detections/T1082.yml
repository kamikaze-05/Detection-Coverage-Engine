title: System Information Discovery via systeminfo.exe
id: 2e5a1b4c-3d6f-4c8e-9a1b-2c3d4e5f6a1b
status: experimental
description: Detects execution of systeminfo.exe, commonly used by attackers for host reconnaissance.
references:
  - https://attack.mitre.org/techniques/T1082/
author: detection-coverage-engine
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\systeminfo.exe'
  condition: selection
falsepositives:
  - IT staff and helpdesk scripts running routine diagnostics
level: low
